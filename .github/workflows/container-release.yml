# The image release of a container repository (dev-kit A3; the caller, rendered by pragmatic-container-template,
# triggers on its tag `v<semver>`, which must equal the version of `version-manifest`: the component descriptor's
# version is that package's version). A release comes only from a commit on main (`check`: the tagged commit is an
# ancestor of origin/main) that passes the same checks container-ci runs before its image bake (`verify`: install, the
# render-drift check, build, typecheck, tests, UI unit tests, the closure check; its steps are container-ci's, held equal
# by the toolkit's workflow test). Each arch is then baked on its own native runner (no QEMU) in two steps (`components`,
# then the image labelled with its component digest; the image build runs the closure check itself) and pushed untagged,
# by digest, to ghcr.io/pragmatic-tech-ai/<app>; the publish job joins the arches under :<version> and :git-<sha>
# (docker buildx imagetools create), reads the image's component label back from the registry and compares it with the
# descriptor, writes the joined digest as the job output `digest` and attaches component.json (the descriptor the image
# carries) and digest.txt to the GitHub release of the tag (created when missing). Nothing is signed here: a platform
# release is assembled and signed in pragmatic-platform-release, from these assets, and only there is its signing key.
# A released version never moves: an existing :<version> or :git-<sha> tag that names another digest than this run
# would write, or an attached asset whose bytes differ, stops the run (cut a new version instead); the same digest and
# identical assets (a re-run of a failed publish job) pass without writing.
# The digest: imagetools create pushes exactly the bytes its --dry-run prints. One source that already is an index (a
# single arch pushed with buildx's provenance attestation is one) is reused as is; a manifest, or several arches, gets a
# new index. So for a single arch the release digest is not the arch's push digest but whatever :<version> resolves to
# after the create, read back from the registry (and checked against the dry run).
# GHCR_TOKEN (optional, a token with write:packages): the nine GHCR packages were created by pragmatic-server and are
# linked to it, so a new repository's GITHUB_TOKEN gets 403 on push until the package grants that repository Actions
# access (package settings, "Manage Actions access"). Until then pass GHCR_TOKEN; without it the run uses its own
# GITHUB_TOKEN (username: the actor either way).
# The npm credentials (PACKAGES_TOKEN, read:packages) are written under umask 077 to one file, read by every npm step
# (NPM_CONFIG_USERCONFIG) and by the bake as its `npmrc` secret, and removed whatever the outcome; inputs reach scripts
# only through env.
name: container-release
on:
  workflow_call:
    inputs:
      app:
        description: The release app, also the repository and image name (pragmatic-<name>).
        type: string
        required: true
      arm64:
        description: Also build linux/arm64 and join both arches under the version tags.
        type: boolean
        default: false
      version-manifest:
        description: The package.json whose version the tag must equal (server/package.json in pragmatic-env-server).
        type: string
        default: package.json
      node-test-glob:
        description: As container-ci's (the tests to run with tsx --test; empty runs npm test).
        type: string
        default: ''
      ui-dirs:
        description: As container-ci's (UI projects whose unit tests run, space or newline separated).
        type: string
        default: ''
      node:
        description: As container-ci's (build and test the repository on the runner).
        type: boolean
        default: true
      closure-check:
        description: As container-ci's (run pragmatic-closure-check).
        type: boolean
        default: true
    secrets:
      PACKAGES_TOKEN:
        required: true
      GHCR_TOKEN:
        required: false
    outputs:
      digest:
        description: The digest the version tag names (the multi-arch index when arm64).
        value: ${{ jobs.publish.outputs.digest }}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      arches: ${{ steps.version.outputs.arches }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: only a commit of main is released"
            exit 1
          fi
      # Fails fast on a ref that is not a `v<semver>` tag or a tag that is not the manifest's version.
      - name: Resolve the version from the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ARM64: ${{ inputs.arm64 }}
          MANIFEST: ${{ inputs.version-manifest }}
        run: |
          pattern='^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$'
          if [ "$REF_TYPE" != tag ] || ! [[ "$REF_NAME" =~ $pattern ]]; then
            echo "::error::not a v<semver> tag: $REF_NAME"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          declared="$(jq -r .version "$MANIFEST")"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $REF_NAME is not the version $declared of $MANIFEST"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$ARM64" = true ]; then
            echo 'arches=["amd64","arm64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["amd64"]' >> "$GITHUB_OUTPUT"
          fi
  # container-ci's build-test steps up to its image bake, copied verbatim (the toolkit's workflow test holds them equal).
  verify:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Write the npm registry credentials
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          umask 077
          printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: npm ci --no-audit --no-fund
      # The repository's rendered files (Dockerfile, bake file, ignore files, tsconfigs, caller workflows, package.json's
      # two fields) are what its installed toolkit renders from package.json `pragmaticContainerTemplate`; a repository
      # without that field fails (every container repository keeps its render arguments).
      - name: Rendered files match the template
        run: |
          if ! node -e "process.exit(require('./package.json').pragmaticContainerTemplate ? 0 : 1)"; then
            echo '::error::package.json has no pragmaticContainerTemplate: keep the render arguments there (pragmatic-container-template render writes them)'
            exit 1
          fi
          npx --no-install pragmatic-container-template check
      - name: Build
        if: inputs.node
        run: npm run build
      - name: Typecheck
        if: inputs.node
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo 'No typecheck script: skipped'
          fi
      - name: Test
        if: inputs.node
        env:
          TEST_GLOB: ${{ inputs.node-test-glob }}
        run: |
          if [ -n "$TEST_GLOB" ]; then
            npx --no-install tsx --test "$TEST_GLOB"
          else
            npm test
          fi
      - name: UI unit tests
        if: inputs.node && inputs.ui-dirs != ''
        env:
          UI_DIRS: ${{ inputs.ui-dirs }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          for dir in $UI_DIRS; do
            (
              cd "$dir"
              npm ci --no-audit --no-fund
              npm test
              if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
                npm run typecheck
              fi
            )
          done
      # The image copies only what its entry reaches: closure.json, the Dockerfile and the code must agree (options from
      # package.json `pragmaticClosureCheck`). The image build runs it again on the tree it is cut from.
      - name: Image closure check
        if: inputs.node && inputs.closure-check
        run: npx --no-install pragmatic-closure-check
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"
  images:
    needs: [check, verify]
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.check.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      APP: ${{ inputs.app }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Write the npm registry credentials
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          umask 077
          printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > "$RUNNER_TEMP/npmrc"
      # This arch is pushed untagged (by digest); the publish job tags the joined index.
      - name: Build and push the image for this arch, by digest
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          NPMRC_FILE="$RUNNER_TEMP/npmrc" PLATFORMS="linux/$ARCH" docker buildx bake -f docker-bake.hcl --allow=fs.read="$RUNNER_TEMP/npmrc" components
          NPMRC_FILE="$RUNNER_TEMP/npmrc" PLATFORMS="linux/$ARCH" docker buildx bake -f docker-bake.hcl \
            -f .components/docker-bake.components.json --allow=fs.read="$RUNNER_TEMP/npmrc" \
            --metadata-file "$RUNNER_TEMP/bake-meta.json" \
            --set "$APP.tags=ghcr.io/pragmatic-tech-ai/$APP" \
            --set "$APP.output=type=image,push-by-digest=true,name-canonical=true,push=true" \
            "$APP"
          jq -r --arg app "$APP" '.[$app]["containerimage.digest"]' "$RUNNER_TEMP/bake-meta.json" > "$RUNNER_TEMP/out/digest-$ARCH"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/out/digest-$ARCH"
          cp ".components/$APP/component.json" "$RUNNER_TEMP/out/component-$ARCH.json"
          jq -r --arg app "$APP" '.[$app]' .components/digests.json > "$RUNNER_TEMP/out/component-digest-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          retention-days: 1
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"
  publish:
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    env:
      APP: ${{ inputs.app }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Every arch carries the same descriptor (it does not depend on the arch); the asset is that one file, and it must
      # hash to the digest every image is labelled with.
      - name: Check the descriptor is the same on every arch
        run: |
          cd "$RUNNER_TEMP/images"
          first=''
          for file in component-*.json; do
            if [ -z "$first" ]; then first="$file"; fi
            cmp "$first" "$file"
          done
          for file in component-digest-*; do
            [ "$(cat "$file")" = "sha256:$(sha256sum "$first" | cut -d ' ' -f 1)" ]
          done
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$first" "$RUNNER_TEMP/assets/component.json"
      # The tags already present must name the digest this run writes (a re-run of a failed publish job); one that names
      # another digest stops the run, so a released version never moves. The planned digest is the sha256 of the bytes
      # --dry-run prints (the ones create pushes, printed with one trailing newline); after the create, :<version> is
      # read back from the registry and must name it.
      - name: Join the arches under the version tags
        id: join
        run: |
          image="ghcr.io/pragmatic-tech-ai/$APP"
          sources=()
          for file in "$RUNNER_TEMP"/images/digest-*; do
            sources+=("$image@$(cat "$file")")
          done
          docker buildx imagetools create --dry-run -t "$image:$VERSION" "${sources[@]}" > "$RUNNER_TEMP/planned.json"
          planned="sha256:$(head -c -1 "$RUNNER_TEMP/planned.json" | sha256sum | cut -d ' ' -f 1)"
          missing=()
          for tag in "$VERSION" "git-$GITHUB_SHA"; do
            if existing="$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' 2> "$RUNNER_TEMP/inspect.err")"; then
              existing="$(jq -r .digest <<< "$existing")"
              if [ "$existing" != "$planned" ]; then
                echo "::error::$image:$tag already names $existing, not $planned: a released tag is never moved (cut a new version)"
                exit 1
              fi
              echo "$image:$tag already names $planned"
            elif grep -qi 'not found' "$RUNNER_TEMP/inspect.err"; then
              missing+=(-t "$image:$tag")
            else
              cat "$RUNNER_TEMP/inspect.err" >&2
              echo "::error::cannot read $image:$tag"
              exit 1
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            docker buildx imagetools create "${missing[@]}" "${sources[@]}"
          fi
          digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$digest"
          if [ "$digest" != "$planned" ]; then
            echo "::error::$image:$VERSION names $digest after the create, not the planned $planned"
            exit 1
          fi
          printf '%s\n' "$digest" > "$RUNNER_TEMP/assets/digest.txt"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$image:$VERSION@$digest"
      # Every arch's image config, read from the registry, carries the label the descriptor hashes to.
      - name: The pushed image's component label is the descriptor's digest
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: |
          image="ghcr.io/pragmatic-tech-ai/$APP"
          expected="sha256:$(sha256sum "$RUNNER_TEMP/assets/component.json" | cut -d ' ' -f 1)"
          arches="$(find "$RUNNER_TEMP/images" -name 'digest-*' | wc -l)"
          docker buildx imagetools inspect "$image@$DIGEST" --format '{{json .Image}}' > "$RUNNER_TEMP/image-config.json"
          labels="$(jq -r 'if has("config") then [.] else [.[]] end | .[] | .config.Labels["ai.pragmatic-tech.component.digest"] // "none"' "$RUNNER_TEMP/image-config.json")"
          if [ "$(wc -l <<< "$labels")" != "$arches" ]; then
            echo "::error::$image@$DIGEST has $(wc -l <<< "$labels") image configs, not $arches"
            exit 1
          fi
          while read -r label; do
            if [ "$label" != "$expected" ]; then
              echo "::error::$image@$DIGEST is labelled $label, not $expected (sha256 of component.json)"
              exit 1
            fi
          done <<< "$labels"
          echo "ok $image@$DIGEST $expected"
      # An asset already attached (a re-run) must be byte-identical; it is never replaced.
      - name: Attach component.json and digest.txt to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/assets"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            attached="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            mkdir -p "$RUNNER_TEMP/attached"
            for asset in component.json digest.txt; do
              if grep -Fxq "$asset" <<< "$attached"; then
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/attached"
                if ! cmp -s "$asset" "$RUNNER_TEMP/attached/$asset"; then
                  echo "::error::the release $TAG already carries another $asset: a released asset is never replaced"
                  exit 1
                fi
                echo "$asset: already attached, identical"
              else
                gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$TAG" component.json digest.txt --verify-tag --title "$APP $VERSION" \
              --notes "ghcr.io/pragmatic-tech-ai/$APP:$VERSION@$(cat digest.txt)" --repo "$GITHUB_REPOSITORY"
          fi
