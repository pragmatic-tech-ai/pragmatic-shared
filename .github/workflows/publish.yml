# Publishes every package of the workspace to GitHub Packages: on a pushed tag v<version> (the version every package
# carries, committed on main before the tag) or on demand from main or a tag. Three jobs:
# - `pack` (read-only token): the commit must be on main, every package must carry one version, the one the tag names
#   (a run on demand: the version a `v<version>` tag on the commit names). It resolves the sibling commits (TODL,
#   todl-runtime) and the Mural version once, as job outputs; installs everything with install scripts off; removes the
#   npm credentials before anything is built; builds the layout ci.yml uses (todl-runtime and TODL beside it, Mural
#   unpacked, one todl-runtime); packs every package as it will be published (tools/publish-packages.ts --pack-into, root
#   build order) with provenance.json and SHA256SUMS (every file's sha256), and uploads them as the `packages` artifact.
#   Its outputs carry the artifact id and the sha256 of SHA256SUMS. No test code runs in this job.
# - `test` (read-only token): the same siblings at the same commits and the same Mural, the full build and the tests.
# - `publish` (environment `packages`, no GITHUB_TOKEN permission): checks nothing out and runs no repository code. It
#   downloads the artifact by its id, refuses it unless SHA256SUMS hashes to the pack job's output and every file matches
#   SHA256SUMS, and publishes the tarballs in order with PACKAGES_PUBLISH_TOKEN, skipping a version already on the
#   registry (a re-run finishes a partial publish). Without that secret the job fails; it never falls back to the run's
#   GITHUB_TOKEN. `secrets.PACKAGES_PUBLISH_TOKEN` also resolves a repository or organisation secret of that name, so
#   none may exist: the token is a secret of the `packages` environment only. A classic write:packages token can write
#   every package its user can; prefer a fine-grained token limited to this organisation's packages.
# Setup (once): environment `packages` with secret PACKAGES_PUBLISH_TOKEN; its deployment rule allows `v*` tags (and main,
# for a run on demand). One publish at a time, whatever the ref (concurrency group `publish`): every run writes the same
# packages, so a second dispatch waits for the first. The artifact is kept 7 days: a failed publish job can be re-run
# alone within that time, after it the whole workflow.
name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  pack:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      todl: ${{ steps.siblings.outputs.todl }}
      runtime: ${{ steps.siblings.outputs.runtime }}
      mural: ${{ steps.mural.outputs.version }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sums: ${{ steps.sums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pragmatic-shared
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        working-directory: ${{ github.workspace }}/pragmatic-shared
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: only a commit of main is published"
            exit 1
          fi
      - name: Every package carries the workspace version, which the tag names
        working-directory: ${{ github.workspace }}/pragmatic-shared
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -e "const root = require('./package.json'); const versions = [...new Set(root.workspaces.map(w => require('./' + w + '/package.json').version))]; if (versions.length !== 1) { console.error('the packages carry several versions: ' + versions.join(', ')); process.exit(1) } console.log(versions[0])")"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not name the workspace version $version"
            exit 1
          fi
          if [ "$REF_TYPE" != tag ] && ! grep -qx "v$version" <<< "$(git tag --points-at "$GITHUB_SHA")"; then
            echo "::error::no tag v$version names $GITHUB_SHA: tag the commit first"
            exit 1
          fi
          echo "publishing $version"
      - name: Clone siblings, resolving their commits once
        id: siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pair in todl-runtime:todl-runtime todl:TODL; do
            git clone --depth 1 "https://github.com/pragmatic-tech-ai/${pair%%:*}.git" "${pair#*:}"
          done
          echo "todl=$(git -C TODL rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(git -C todl-runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Configure GitHub Packages auth (read)
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (umask 077 && printf 'registry=https://registry.npmjs.org/\n@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > ~/.npmrc)
      - name: Mural from GitHub Packages, its version resolved once
        id: mural
        working-directory: ${{ github.workspace }}
        run: |
          version=$(npm view @pragmatic-tech-ai/mural version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm pack "@pragmatic-tech-ai/mural@$version" --silent
          mkdir Mural
          tar -xzf pragmatic-tech-ai-mural-"$version".tgz -C Mural --strip-components=1
          (cd Mural && npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund)
      - name: Install everything (install scripts off)
        working-directory: ${{ github.workspace }}
        run: |
          (cd todl-runtime && npm install --ignore-scripts --no-audit --no-fund)
          (cd TODL && npm install --ignore-scripts --no-audit --no-fund)
          (cd pragmatic-shared && npm ci --ignore-scripts --no-audit --no-fund)
      # Nothing is built while a registry token is on disk.
      - name: Remove credentials before the build
        run: rm -f ~/.npmrc
      # TODL's build compiles its .mu modules with the mural CLI, which it finds in its own node_modules: the peer is
      # the unpacked Mural, linked in after TODL's install.
      - name: Build todl-runtime and TODL against the unpacked Mural
        working-directory: ${{ github.workspace }}
        run: |
          (cd todl-runtime && npm run build)
          rm -rf TODL/node_modules/@pragmatic-tech-ai/mural
          mkdir -p TODL/node_modules/@pragmatic-tech-ai
          ln -s ../../../Mural TODL/node_modules/@pragmatic-tech-ai/mural
          (cd TODL && npm run build)
      - name: One todl-runtime in the workspace
        working-directory: ${{ github.workspace }}
        run: |
          for consumer in TODL Mural; do
            rm -rf "$consumer/node_modules/@pragmatic-tech-ai/todl-runtime"
            mkdir -p "$consumer/node_modules/@pragmatic-tech-ai"
            ln -s ../../../todl-runtime "$consumer/node_modules/@pragmatic-tech-ai/todl-runtime"
          done
      - name: Build
        working-directory: ${{ github.workspace }}/pragmatic-shared
        run: npm run build
      # The pack looks each rewritten peer up on the registry: the read token again, after the build.
      - name: Configure GitHub Packages auth (read, for the pack)
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (umask 077 && printf 'registry=https://registry.npmjs.org/\n@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > ~/.npmrc)
      - name: Pack every package in build order, with its provenance
        working-directory: ${{ github.workspace }}/pragmatic-shared
        env:
          TODL_SHA: ${{ steps.siblings.outputs.todl }}
          RUNTIME_SHA: ${{ steps.siblings.outputs.runtime }}
          MURAL_VERSION: ${{ steps.mural.outputs.version }}
        run: |
          order="$(node -e "const s = require('./package.json').scripts.build; console.log([...s.matchAll(/-w (packages\/[a-z0-9-]+)/g)].map(m => m[1]).join(' '))")"
          # shellcheck disable=SC2086
          npm run publish:packages -- --pack-into "$RUNNER_TEMP/bundle" $order
          jq -n --arg shared "$GITHUB_SHA" --arg todl "$TODL_SHA" --arg runtime "$RUNTIME_SHA" --arg mural "$MURAL_VERSION" \
            '{ "pragmatic-shared": $shared, "TODL": $todl, "todl-runtime": $runtime, "mural": $mural }' > "$RUNNER_TEMP/bundle/provenance.json"
          cat "$RUNNER_TEMP/bundle/provenance.json"
      - name: Checksums of the bundle
        id: sums
        working-directory: ${{ runner.temp }}/bundle
        run: |
          sha256sum -- *.tgz packages.json provenance.json > SHA256SUMS
          echo "sha256=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: packages
          path: ${{ runner.temp }}/bundle
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Remove credentials
        if: always()
        run: rm -f ~/.npmrc
  test:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pragmatic-shared
          persist-credentials: false
      - name: Clone siblings at the commits the pack resolved
        working-directory: ${{ github.workspace }}
        env:
          TODL_SHA: ${{ needs.pack.outputs.todl }}
          RUNTIME_SHA: ${{ needs.pack.outputs.runtime }}
        run: |
          for pair in "todl-runtime:todl-runtime:$RUNTIME_SHA" "todl:TODL:$TODL_SHA"; do
            IFS=: read -r repo dir sha <<< "$pair"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/pragmatic-tech-ai/$repo.git" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            [ "$(git -C "$dir" rev-parse HEAD)" = "$sha" ] || { echo "::error::$repo is not at $sha"; exit 1; }
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Configure GitHub Packages auth (read)
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (umask 077 && printf 'registry=https://registry.npmjs.org/\n@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_TOKEN" > ~/.npmrc)
      - name: Build todl-runtime
        working-directory: ${{ github.workspace }}/todl-runtime
        run: npm install --no-audit --no-fund && npm run build
      - name: Mural from GitHub Packages, the version the pack resolved
        working-directory: ${{ github.workspace }}
        env:
          MURAL_VERSION: ${{ needs.pack.outputs.mural }}
        run: |
          npm pack "@pragmatic-tech-ai/mural@$MURAL_VERSION" --silent
          mkdir Mural
          tar -xzf pragmatic-tech-ai-mural-"$MURAL_VERSION".tgz -C Mural --strip-components=1
          (cd Mural && npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund)
      - name: Build TODL against the unpacked Mural
        working-directory: ${{ github.workspace }}/TODL
        run: |
          npm install --no-audit --no-fund
          rm -rf node_modules/@pragmatic-tech-ai/mural
          mkdir -p node_modules/@pragmatic-tech-ai
          ln -s ../../../Mural node_modules/@pragmatic-tech-ai/mural
          npm run build
      - name: One todl-runtime in the workspace
        working-directory: ${{ github.workspace }}
        run: |
          for consumer in TODL Mural; do
            rm -rf "$consumer/node_modules/@pragmatic-tech-ai/todl-runtime"
            mkdir -p "$consumer/node_modules/@pragmatic-tech-ai"
            ln -s ../../../todl-runtime "$consumer/node_modules/@pragmatic-tech-ai/todl-runtime"
          done
      - name: Install
        working-directory: ${{ github.workspace }}/pragmatic-shared
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: ${{ github.workspace }}/pragmatic-shared
        run: npm run build
      - name: Typecheck the packages and their tests
        working-directory: ${{ github.workspace }}/pragmatic-shared
        run: npm run typecheck --workspaces && npm run typecheck:tools
      - name: Test
        working-directory: ${{ github.workspace }}/pragmatic-shared
        run: npm test --workspaces && npm run test:tools
      - name: Remove credentials
        if: always()
        run: rm -f ~/.npmrc
  publish:
    needs: [pack, test]
    runs-on: ubuntu-latest
    environment: packages
    permissions: {}
    steps:
      - name: The packages environment holds the publish token
        env:
          PACKAGES_PUBLISH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PACKAGES_PUBLISH_TOKEN" ]; then
            echo '::error::PACKAGES_PUBLISH_TOKEN is not a secret of the packages environment: nothing is published (no fallback to GITHUB_TOKEN)'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/bundle
      - name: The bundle is the one the pack made
        working-directory: ${{ runner.temp }}/bundle
        env:
          SUMS_SHA256: ${{ needs.pack.outputs.sums }}
        run: |
          # A download by id extracts into a folder named after the artifact.
          if [ -d packages ]; then
            shopt -s dotglob
            mv packages/* .
            rmdir packages
          fi
          [ "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" = "$SUMS_SHA256" ] || { echo '::error::SHA256SUMS is not the one the pack job wrote'; exit 1; }
          sha256sum -c --strict SHA256SUMS
      - name: Configure GitHub Packages auth (publish)
        env:
          PACKAGES_PUBLISH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          (umask 077 && printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGES_PUBLISH_TOKEN" > ~/.npmrc)
      - name: Publish the packed tarballs in order
        working-directory: ${{ runner.temp }}/bundle
        run: |
          cat provenance.json
          count="$(jq length packages.json)"
          for i in $(seq 0 $((count - 1))); do
            name="$(jq -r ".[$i].Name" packages.json)"
            version="$(jq -r ".[$i].Version" packages.json)"
            file="$(jq -r ".[$i].File" packages.json)"
            if ! [[ "$file" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || [[ "$file" == *..* ]]; then
              echo "::error::not a tarball file name: $file"
              exit 1
            fi
            if [ -n "$(npm view "$name@$version" version --registry https://npm.pkg.github.com 2> /dev/null)" ]; then
              echo "$name@$version: already published, skipped"
              continue
            fi
            npm publish "./$file" --ignore-scripts --registry https://npm.pkg.github.com
            echo "$name@$version: published"
          done
      - name: Remove credentials
        if: always()
        run: rm -f ~/.npmrc
